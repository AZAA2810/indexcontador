<!DOCTYPE html>
<html>

<head>
    <title>Contador</title>
</head>

<body>

<h1>Bienvenido 👋</h1>

<p id="contador"></p>

<script>
let veces = localStorage.getItem("visitas");

if (veces === null) {
    veces = 1;
} else {
    veces = Number(veces) + 1;
}

localStorage.setItem("visitas", veces);

document.getElementById("contador").innerText =
"Has entrado " + veces + " veces a esta página";
</script>

</body>
